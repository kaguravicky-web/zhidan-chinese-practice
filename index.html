<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智澹中文练习</title>
  <style>
    :root {
      --blue: #1f6fbf;
      --blue-dark: #154a80;
      --blue-soft: #eaf4ff;
      --school: #f2c94c;
      --school-dark: #7a5700;
      --school-soft: #fff7d8;
      --school-line: #ecd083;
      --bg: #f6f9fc;
      --card: #ffffff;
      --text: #17212b;
      --muted: #637083;
      --line: #d9e4ef;
      --ok: #1f8a50;
      --bad: #c94b42;
      --grid: #d9b957;
      --hint-bg: #fffbe6;
      --hint-line: #f3dd97;
      --hint-bar: #e3b93b;
      --hint-ink: #6b5210;
      --hint-ink-soft: #8a7233;
      --hint-size: 16px;
      --hint-size-small: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    body::before {
      content: "";
      display: block;
      height: 8px;
      background: repeating-linear-gradient(90deg, #1769aa 0 54px, #fff 54px 74px, #f2c94c 74px 128px, #fff 128px 148px);
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .top {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); color: var(--blue-dark); letter-spacing: 0; }
    h2 { margin: 0 0 12px; color: var(--blue-dark); }
    .sub { margin: 4px 0 0; color: var(--muted); font-weight: 700; }
    .score {
      min-width: 156px;
      border-radius: 8px;
      background: var(--blue-soft);
      padding: 10px 12px;
      text-align: center;
      font-weight: 800;
      color: var(--blue-dark);
    }
    .parent-open { justify-self: end; }
    .voice-panel {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-weight: 700;
    }
    dialog {
      width: min(680px, calc(100% - 28px));
      border: 0;
      border-radius: 8px;
      padding: 0;
      box-shadow: 0 22px 70px rgba(10, 48, 84, .28);
    }
    dialog::backdrop { background: rgba(20, 48, 75, .48); }
    .parent-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      color: #fff;
      background: var(--blue-dark);
    }
    .parent-head h2 { margin: 0; color: #fff; }
    .parent-body { padding: 18px; }
    .setting-block { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .setting-block:last-child { border-bottom: 0; }
    .upload-zone {
      display: block;
      margin-top: 10px;
      padding: 20px;
      text-align: center;
      border: 2px dashed #8bb7df;
      border-radius: 8px;
      background: var(--blue-soft);
      cursor: pointer;
      font-weight: 800;
    }
    .upload-zone input { display: none; }
    .photo-preview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .photo-preview img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; }
    select, input[type="range"] {
      min-height: 36px;
      border: 1px solid #bfd0e2;
      border-radius: 8px;
      background: #fff;
      padding: 4px 8px;
      font: inherit;
    }
    main { max-width: 1180px; margin: 0 auto; padding: 18px; }
    button {
      font: inherit;
      border: 1px solid #bfd0e2;
      border-radius: 8px;
      min-height: 42px;
      padding: 8px 13px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
    }
    button:hover { border-color: var(--blue); }
    button.primary { background: var(--blue); border-color: var(--blue); color: white; }
    button.ghost { background: transparent; }
    button.selected { background: #dbeeff; border-color: var(--blue); color: var(--blue-dark); }
    button.good { background: #e4f6eb; border-color: var(--ok); color: #126236; }
    button.bad { background: #ffe9e7; border-color: var(--bad); color: #9b2c25; }
    button:disabled { cursor: default; opacity: 1; }
    .view { display: none; }
    .view.active { display: block; }
    .home-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 14px;
    }
    .home-tab.active[data-home="schoolHomePanel"] {
      background: var(--school);
      border-color: var(--school);
      color: #2f2300;
    }
    .home-tab.active[data-home="hclHomePanel"] {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }
    .home-tab.active[data-home="workbookHomePanel"] {
      background: #17212b;
      border-color: #17212b;
      color: #fff;
    }
    .home-panel { display: none; }
    .home-panel.active { display: block; }
    .home-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 14px;
    }
    .course-card, .panel, .practice-card, .garage {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(28, 73, 118, .06);
    }
    .course-card { padding: 18px; }
    .course-card::before {
      content: "🏎️  本周赛道";
      display: block;
      margin-bottom: 10px;
      color: var(--blue);
      font-weight: 900;
    }
    .course-card.school-card {
      border-color: var(--school-line);
      background: linear-gradient(180deg, var(--school-soft), #fff);
      box-shadow: 0 8px 22px rgba(122, 87, 0, .08);
    }
    .course-card.school-card::before {
      content: "🟡  学校听写";
      color: var(--school-dark);
    }
    .course-card.school-card h2 { color: var(--school-dark); }
    .course-card.school-card button.primary {
      background: var(--school-dark);
      border-color: var(--school-dark);
      color: #fff;
    }
    .course-card.hcl-card {
      border-color: #b9d7f3;
      background: linear-gradient(180deg, var(--blue-soft), #fff);
    }
    .course-card.hcl-card::before {
      content: "🔵  HCL 练习";
      color: var(--blue-dark);
    }
    .course-card.mixed-card {
      border-top: 5px solid var(--blue);
      box-shadow: inset 0 5px 0 var(--school);
    }
    .course-card.mixed-card::before {
      content: "🟡 学校 + 🔵 HCL";
    }
    .course-card h2 { font-size: 24px; }
    .course-meta { color: var(--muted); line-height: 1.7; margin: 10px 0 16px; }
    .garage { margin-top: 16px; padding: 16px; }
    .garage h2::before { content: "🏁 "; }
    .wrong-book { margin-top: 16px; padding: 16px; }
    .wrong-book h2::before { content: "📒 "; }
    .wrong-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }
    .car-row { display: flex; gap: 10px; flex-wrap: wrap; min-height: 48px; align-items: center; }
    .car {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--blue-soft);
      color: var(--blue-dark);
      font-weight: 800;
    }
    .panel { display: none; padding: 16px; }
    .panel.active { display: block; }
    .back-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .tabs, .subtabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; }
    .tabs .tab[hidden] { display: none; }
    .tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .tab[data-panel="schoolWritingPanel"].active {
      background: var(--school);
      color: #2f2300;
      border-color: var(--school);
    }
    .tab[data-panel="hclWritingPanel"].active,
    .tab[data-panel="hclPracticePanel"].active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }
    .subtab.active { background: #dbeafe; color: var(--blue-dark); border-color: #93c5fd; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0 14px; }
    .note { color: var(--muted); font-weight: 700; }
    .guide-tip {
      margin: 8px 0 10px;
      padding: 8px 10px;
      border: 1px solid var(--hint-line);
      border-radius: 8px;
      background: var(--hint-bg);
      color: var(--hint-ink);
      font-size: var(--hint-size);
      font-weight: 700;
      line-height: 1.45;
    }
    .practice-list { display: grid; gap: 14px; }
    .practice-section { display: none; }
    .practice-section.active { display: block; }
    .practice-card { padding: 14px; }
    #schoolWritingPanel {
      border-color: var(--school-line);
      background: linear-gradient(180deg, var(--school-soft), #fff);
    }
    #schoolWritingPanel h2,
    #schoolWritingPanel .dictation-head h3,
    #schoolWritingPanel .dictation-number,
    #schoolWritingPanel .dictation-hint {
      color: var(--school-dark);
    }
    #schoolWritingPanel .dictation-item {
      border-color: var(--school-line);
      background: #fffdf4;
    }
    #schoolWritingPanel .primary {
      background: var(--school-dark);
      border-color: var(--school-dark);
      color: #fff;
    }
    #hclWritingPanel,
    #hclPracticePanel {
      border-color: #b9d7f3;
      background: linear-gradient(180deg, #f7fbff, #fff);
    }
    .dictation-group { margin-bottom: 18px; }
    .dictation-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .dictation-head h3 { margin: 0; color: var(--blue-dark); font-size: 22px; }
    .dictation-list { display: grid; gap: 8px; }
    .dictation-item {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto auto 52px;
      gap: 10px;
      align-items: center;
      min-height: 66px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .dictation-group:not(.show-mastered) .dictation-item.mastered { display: none; }
    .dictation-item.mastered {
      border-color: var(--ok);
      background: #f0fbf4;
      opacity: .72;
    }
    .dictation-number { color: var(--blue); font-size: 20px; font-weight: 900; }
    .dictation-text { font-size: 22px; font-weight: 800; line-height: 1.45; }
    .dictation-hint { display: none; font-size: 22px; font-weight: 900; color: var(--blue-dark); letter-spacing: 2px; }
    .dictation-item.is-hidden .dictation-text,
    .dictation-item.is-hidden .pinyin { display: none; }
    .dictation-item.is-partial .dictation-text,
    .dictation-item.is-partial .pinyin { display: none; }
    .dictation-item.is-partial .dictation-hint { display: block; }
    .dictation-item.is-hidden .dictation-content::before {
      content: "文字已隐藏，听声音默写";
      color: var(--muted);
      font-weight: 800;
    }
    .peek-one, .master-one { white-space: nowrap; }
    .card-head {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      gap: 8px;
      align-items: center;
    }
    .speak { width: 44px; padding: 0; }
    .item-title { font-size: 22px; font-weight: 800; }
    .pinyin { color: var(--muted); font-size: 14px; }
    .copy-text {
      margin: 12px 0;
      min-height: 34px;
      font-size: 28px;
      color: rgba(23, 33, 43, .38);
      font-weight: 800;
      line-height: 1.6;
    }
    .copy-text.hidden { font-size: 20px; color: var(--muted); }
    .tianzige-row { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
    .tianzi {
      position: relative;
      width: 170px;
      height: 170px;
      border: 2px solid var(--grid);
      border-radius: 4px;
      background:
        linear-gradient(90deg, transparent 49.4%, rgba(217,185,87,.7) 49.4% 50.6%, transparent 50.6%),
        linear-gradient(transparent 49.4%, rgba(217,185,87,.7) 49.4% 50.6%, transparent 50.6%),
        linear-gradient(45deg, transparent 49.5%, rgba(217,185,87,.42) 49.5% 50.5%, transparent 50.5%),
        linear-gradient(-45deg, transparent 49.5%, rgba(217,185,87,.42) 49.5% 50.5%, transparent 50.5%),
        #fffefa;
    }
    .trace-char {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 104px;
      font-weight: 800;
      color: rgba(23,33,43,.16);
      pointer-events: none;
      user-select: none;
    }
    .draw {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }
    .question {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 12px;
      padding: 14px;
      margin: 12px 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .question > * { grid-column: 1 / -1; }
    .question > .qtext { grid-column: 1; grid-row: 1; }
    .question > .speak { grid-column: 2; grid-row: 1; justify-self: end; align-self: start; }
    .qtext { font-size: 20px; font-weight: 700; line-height: 1.55; }
    .vocab-help {
      min-height: 0;
      padding: 0 2px;
      border: 0;
      border-bottom: 2px dotted var(--blue);
      border-radius: 0;
      background: #eff7ff;
      color: var(--blue-dark);
      font: inherit;
      font-weight: 900;
      cursor: help;
    }
    .vocab-help:hover { background: #dbeafe; }
    .vocab-popover {
      position: fixed;
      z-index: 20;
      left: min(24px, 5vw);
      right: min(24px, 5vw);
      bottom: 18px;
      max-width: 560px;
      margin: 0 auto;
      padding: 14px;
      border: 1px solid #93c5fd;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 45px rgba(15, 58, 104, .18);
      color: var(--ink);
    }
    .vocab-popover[hidden] { display: none; }
    .vocab-popover h3 { margin: 0 0 4px; color: var(--blue-dark); font-size: 24px; }
    .vocab-popover p { margin: 5px 0; line-height: 1.55; }
    .vocab-popover .bar { margin-bottom: 0; }
    .vocab-strip {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      color: var(--muted);
      font-weight: 800;
      padding: 2px 0 4px;
    }
    .vocab-chip {
      min-height: 30px;
      padding: 3px 8px;
      border: 1px solid #93c5fd;
      background: #eff7ff;
      color: var(--blue-dark);
    }
    .options {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
    }
    .option { text-align: left; min-height: 46px; }
    .answer-line {
      grid-column: 1 / -1;
      min-height: 22px;
      font-size: var(--hint-size);
      font-weight: 700;
      color: var(--hint-ink);
      background: var(--hint-bg);
      border-left: 4px solid var(--hint-bar);
      border-radius: 6px;
      padding: 8px 10px;
    }
    .answer-english {
      margin-top: 5px;
      color: var(--hint-ink-soft);
      font-size: var(--hint-size-small);
      font-weight: 700;
    }
    .answer-line:empty { display: none; }
    .tutor-box {
      grid-column: 1 / -1;
      border: 1px solid var(--hint-line);
      border-radius: 8px;
      background: var(--hint-bg);
      padding: 9px 11px;
      color: var(--hint-ink);
      font-size: var(--hint-size);
      font-weight: 700;
      line-height: 1.5;
    }
    .tutor-box:empty { display: none; }
    .tutor-title { font-weight: 900; margin-bottom: 4px; }
    .tutor-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 8px; }
    .tutor-actions button { min-height: 34px; padding: 5px 10px; }
    .picked-line {
      grid-column: 1 / -1;
      min-height: 48px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border: 1px dashed #bfd0e2;
      border-radius: 8px;
      background: #f7fbff;
    }
    .picked-line button { background: #eef7ff; }
    .picked-line button.good { background: #e4f6eb; border-color: var(--ok); color: #126236; }
    .picked-line button.bad { background: #ffe9e7; border-color: var(--bad); color: #9b2c25; }
    .order-actions { grid-column: 1 / -1; }
    .sequence-card {
      grid-column: 1 / -1;
      display: grid;
      gap: 6px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }
    .sequence-row {
      display: grid;
      grid-template-columns: 54px 1fr;
      gap: 8px;
      align-items: start;
      padding: 6px 8px;
      border-radius: 8px;
      background: #f7fbff;
      line-height: 1.35;
    }
    .sequence-row.fixed { background: #eef7ff; font-weight: 800; }
    .sequence-row.good { background: #eaf8ef; }
    .sequence-row.bad { background: #fff0ef; }
    .sequence-row.tappable { cursor: pointer; }
    .sequence-row.tappable:hover { background: #e8f2fd; }
    .sequence-row.picked { background: #eaf4ff; }
    .sequence-row.picked.good { background: #eaf8ef; }
    .sequence-row.picked.bad { background: #fff0ef; }
    .seq-num {
      width: 46px;
      min-height: 40px;
      padding: 4px;
      border: 1px solid #bfd0e2;
      border-radius: 8px;
      background: #fff;
      font: inherit;
      font-size: 20px;
      font-weight: 900;
      text-align: center;
      color: var(--blue-dark);
    }
    .seq-num.empty { color: #9fb3c8; }
    .sequence-row.picked .seq-num { background: var(--blue); border-color: var(--blue); color: #fff; }
    .sequence-row.good .seq-num { background: var(--ok); border-color: var(--ok); color: #fff; }
    .sequence-row.bad .seq-num { background: var(--bad); border-color: var(--bad); color: #fff; }
    .insert-card {
      grid-column: 1 / -1;
      display: grid;
      gap: 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }
    .insert-origin {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: baseline;
      padding: 9px 11px;
      border-radius: 8px;
      background: #f2f7fc;
      font-size: 19px;
      line-height: 1.6;
    }
    .insert-label {
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }
    .insert-todo { color: var(--muted); font-size: 16px; font-weight: 800; }
    .insert-todo b { color: var(--blue-dark); font-size: 20px; }
    .insert-line {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      align-items: center;
      font-size: 20px;
      line-height: 2;
    }
    .insert-gap {
      min-width: 34px;
      min-height: 34px;
      padding: 0 6px;
      border: 1px dashed var(--blue);
      border-radius: 8px;
      background: #f4faff;
      color: var(--blue);
      font: inherit;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }
    .insert-gap:hover:not(:disabled) { background: #dbeafe; }
    .insert-gap:disabled { border-style: dotted; color: #b8c7d6; cursor: default; }
    .insert-word {
      min-height: 34px;
      padding: 2px 10px;
      border: 1px solid var(--blue);
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }
    .insert-card.good .insert-word { background: var(--ok); border-color: var(--ok); }
    .insert-card.bad .insert-word { background: var(--bad); border-color: var(--bad); }
    .insert-chunk { padding: 0 1px; }
    .speech-dock {
      position: fixed;
      z-index: 40;
      top: 10px;
      right: 12px;
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 6px 8px;
      border: 1px solid var(--blue);
      border-radius: 999px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 8px 22px rgba(15, 58, 104, .18);
    }
    .speech-dock[hidden] { display: none; }
    .speech-dock button { min-height: 38px; padding: 4px 12px; font-size: 15px; }
    .speech-dock .speech-label { color: var(--blue-dark); font-size: 14px; font-weight: 800; padding-left: 4px; }
    .back-to-top {
      position: fixed;
      z-index: 15;
      right: 12px;
      bottom: 14px;
      min-height: 46px;
      padding: 8px 14px;
      border: 1px solid var(--blue);
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(15, 58, 104, .22);
    }
    .back-to-top[hidden] { display: none; }
    body.popover-open .back-to-top { display: none; }

    const audioCtx = () => new (window.AudioContext || window.webkitAudioContext)();
    function tone(freq, duration, type = "sine", gainValue = 0.08, delay = 0) {
      const ctx = window._ctx || (window._ctx = audioCtx());
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = type;
      gain.gain.value = gainValue;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
      osc.stop(ctx.currentTime + delay + duration);
    }
    function clapSound() {
      tone(760, .08, "square", .045, 0);
      tone(980, .08, "square", .045, .09);
      tone(1180, .11, "triangle", .04, .18);
    }
    function funnyWrongSound() {
      tone(260, .12, "sawtooth", .045, 0);
      tone(150, .18, "sawtooth", .04, .12);
    }
    let speechToken = 0;
    let speechWatch = 0;
    function speechDockEl(id) { return document.getElementById(id); }
    function watchSpeech() {
      clearInterval(speechWatch);
      const startedAt = Date.now();
      speechWatch = setInterval(() => {
        const synth = window.speechSynthesis;
        if (Date.now() - startedAt < 900) return;
        if (!synth.speaking && !synth.pending && !synth.paused) {
          clearInterval(speechWatch);
          setSpeechDock("off");
        }
      }, 500);
    }
    function setSpeechDock(state) {
      const dock = speechDockEl("speechDock");
      const toggle = speechDockEl("speechToggle");
      if (!dock || !toggle) return;
      if (state === "off") {
        dock.hidden = true;
        return;
      }
      dock.hidden = false;
      toggle.textContent = state === "paused" ? "▶ 继续" : "⏸ 暂停";
    }
    function stopSpeaking() {
      speechToken += 1;
      clearInterval(speechWatch);
      window.speechSynthesis.resume();
      window.speechSynthesis.cancel();
      setSpeechDock("off");
    }
    function toggleSpeaking() {

    function speak(text, lang = "zh-CN", readPunctuation = false) {

      window.speechSynthesis.cancel();
      const spokenText = readPunctuation && lang.startsWith("zh") ? verbalizeChinesePunctuation(text) : text;
      const u = new SpeechSynthesisUtterance(spokenText);
      u.lang = lang;
      u.rate = speechRate;
      u.pitch = lang.startsWith("en") ? 0.95 : 0.78;
      const voices = window.speechSynthesis.getVoices();
      const selected = lang.startsWith("zh") ? voices.find(v => v.name === selectedVoiceName) : null;
      const en = voices.find(v => /en/i.test(v.lang));
      const male = voices.find(v => /zh/i.test(v.lang) && /Yunxi|Yunjian|Kangkang|Male|男|云希|云健/i.test(v.name));
      const zh = voices.find(v => /zh/i.test(v.lang));
      u.voice = selected || (lang.startsWith("en") ? en : male || zh) || null;
      u.onend = () => { if (myToken === speechToken) setSpeechDock("off"); };
      u.onerror = u.onend;
      window.speechSynthesis.speak(u);
      setSpeechDock("playing");

    function englishForAnswer(text) {

        .replace(/^第\d+题正确答案：/, "")

        .filter(word => cleaned.includes(word))

      const used = [];
      let covered = cleaned;
      words.forEach(word => {
        if (covered.includes(word)) {

    function prepareCanvas(canvas) {
      const resize = () => {
        const ratio = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, Math.floor(rect.width * ratio));
        canvas.height = Math.max(1, Math.floor(rect.height * ratio));
        const ctx = canvas.getContext("2d");
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.lineWidth = 7 * ratio;
        ctx.strokeStyle = "#111827";
        canvas._ctx = ctx;
        canvas._ratio = ratio;
      };
      resize();
      let drawing = false;
      const pos = e => {
        const r = canvas.getBoundingClientRect();
        return { x: (e.clientX - r.left) * canvas._ratio, y: (e.clientY - r.top) * canvas._ratio };
      };
      canvas.addEventListener("pointerdown", e => {
        e.preventDefault();
        canvas.setPointerCapture(e.pointerId);
        drawing = true;
        const p = pos(e);
        canvas._ctx.beginPath();
        canvas._ctx.moveTo(p.x, p.y);
      });
      canvas.addEventListener("pointermove", e => {
        if (!drawing) return;
        e.preventDefault();
        const p = pos(e);
        canvas._ctx.lineTo(p.x, p.y);
        canvas._ctx.stroke();
      });
      canvas.addEventListener("pointerup", () => drawing = false);
      canvas.addEventListener("pointercancel", () => drawing = false);
      canvas.clearBox = () => canvas._ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function setDictationRowMode(row, mode) {
      row.classList.toggle("is-hidden", mode === "hidden");

    function makeDictationHint(text) {
      return text.split(/([，。！？；：,.!?;:])/).map(part => {
        if (/^[，。！？；：,.!?;:]$/.test(part)) return part;
        const chars = Array.from(part);
        const chineseIndexes = chars.map((char, index) => /[\u3400-\u9fff]/.test(char) ? index : -1).filter(index => index >= 0);
        if (!chineseIndexes.length) return chars.map(char => char.trim() ? "□" : char).join("");
        const visible = new Set([chineseIndexes[0]]);
        if (chineseIndexes.length >= 4) visible.add(chineseIndexes[chineseIndexes.length - 1]);
        return chars.map((char, index) => /[\u3400-\u9fff]/.test(char) && !visible.has(index) ? "□" : char).join("");
      }).join("");
    }

        bank.querySelectorAll(".sequence-row:not(.fixed)").forEach((lineRow, lineIndex) => {
          lineRow.classList.toggle("good", values[lineIndex] === item.lines[lineIndex].answer);
          lineRow.classList.toggle("bad", values[lineIndex] !== item.lines[lineIndex].answer);
        });
        if (isRight) {
          answerLine.textContent = "顺序正确。";
          setTutor(tutorBox, {
            en: "Great. You used time order.",
            zh: "很好。你按时间顺序排对了。"
          });
          lineRows.forEach(lineRow => lineRow.classList.remove("tappable"));
          checkButton.disabled = true;
          checkButton.textContent = "已确认";
          resetButton.disabled = true;
          if (item.wrongKey) removeWrong(item.wrongKey);
          markQuestion("o" + index, true);
        } else {
          const tutor = tutorForSequence(item, values);
          answerLine.textContent = "有几句顺序不对。绿色句子已经对了，点红色的句子取消，再重新点一次。";
          setTutor(tutorBox, tutor);
          recordWrong({
            key: item.wrongKey || makeQuestionKey("order", item.prompt, item.finalText),
            kind: "order",
            item,
            prompt: item.prompt,
            finalText: item.finalText,
            tutor
          });
          funnyWrongSound();
        }
      }
      const tapHint = document.createElement("div");
      tapHint.className = "note";
      tapHint.textContent = "点句子，按先后顺序排。点错了再点一次可以取消，也可以按“重排”。";
      bank.appendChild(tapHint);
      item.lines.forEach((line, lineIndex) => {
        const lineRow = document.createElement("div");
        lineRow.className = "sequence-row tappable";
        const badge = document.createElement("button");
        badge.className = "seq-num empty";
        badge.type = "button";
        badge.textContent = "？";
        badge.setAttribute("aria-label", `第${lineIndex + 1}句的序号`);
        const text = document.createElement("div");
        text.innerHTML = annotateText(line.text);
        lineRow.append(badge, text);
        lineRow.onclick = event => {
          if (done.has("o" + index)) return;
          if (event.target.closest(".vocab-help")) return;
          const at = picked.indexOf(lineIndex);
          if (at >= 0) picked.splice(at, 1);
          else if (picked.length < item.lines.length) picked.push(lineIndex);
          clearMarks();
          refreshSequence();
        };
        lineRows.push(lineRow);
        bank.appendChild(lineRow);
      });
      const checkButton = document.createElement("button");
      checkButton.className = "primary";
      checkButton.textContent = "确认顺序";
      checkButton.disabled = true;
      checkButton.onclick = checkSequence;
      const resetButton = document.createElement("button");
      resetButton.className = "ghost";
      resetButton.textContent = "重排";
      resetButton.onclick = () => {
        if (done.has("o" + index)) return;
        resetSequence();
      };
      const showAnswer = document.createElement("button");
      showAnswer.className = "ghost";
      showAnswer.textContent = "我放弃，看答案";
      showAnswer.onclick = () => {
        if (done.has("o" + index)) return;
        answerLine.innerHTML = answerHTML("正确答案：", item.finalText);
        setTutor(tutorBox, {
          en: "Read the answer once. Try it again later.",
          zh: "读一遍答案。下次再从错题本练。"
        });
        lineRows.forEach(lineRow => lineRow.classList.remove("tappable"));
        checkButton.disabled = true;
        resetButton.disabled = true;
        showAnswer.disabled = true;
        recordWrong({
          key: item.wrongKey || makeQuestionKey("order", item.prompt, item.finalText),
          kind: "order",
          item,
          prompt: item.prompt,
          finalText: item.finalText,
          tutor: tutorForSequence(item, [])
        });
        markQuestion("o" + index, false);
      };
      options.appendChild(checkButton);
      options.appendChild(resetButton);
      options.appendChild(showAnswer);
      options.classList.add("order-actions");
      refreshSequence();
    }
    function renderCloze() {
      const list = document.getElementById("clozeList");
      list.innerHTML = "";
      const box = document.createElement("div");
      box.className = "cloze-box";
      currentCourse.clozeParts.forEach((part, i) => {
        const textPart = document.createElement("span");
        textPart.innerHTML = annotateText(part);
        box.append(textPart);
        if (i < currentCourse.clozeAnswers.length) {
          const blank = document.createElement("span");
          blank.className = "blank";
          blank.dataset.answer = currentCourse.clozeAnswers[i];
          blank.textContent = `${i + 1}`;
          box.appendChild(blank);
        }
      });
      const bank = document.createElement("div");
      bank.className = "word-bank";
      currentCourse.clozeWords.forEach(word => {
        const b = document.createElement("button");
        b.textContent = word;
        b.onclick = () => {
          const next = [...box.querySelectorAll(".blank")].find(x => /^\d+$/.test(x.textContent));
          if (!next) return;
          const isRight = word === next.dataset.answer;
          if (isRight) {
            next.textContent = word;
            next.classList.remove("bad");
            next.classList.add("good");
            [...bank.children].forEach(x => x.classList.remove("bad"));
            b.classList.add("good");
            markQuestion("c" + [...box.querySelectorAll(".blank")].indexOf(next), true);
          } else {
            next.classList.add("bad");
            b.classList.add("bad");
            funnyWrongSound();
          }
        };
        bank.appendChild(b);
      });
      const controls = document.createElement("div");
      controls.className = "bar";
      const read = document.createElement("button");
      read.className = "primary";
      read.textContent = "朗读短文";
      read.onclick = () => speak(currentCourse.clozeParts.join(" 空格 "));
      controls.append(read);
      const helpWords = vocabWordsInTexts([...(currentCourse.clozeParts || []), ...(currentCourse.clozeWords || [])]);
      const helpStrip = helpWords.length ? createVocabStrip(helpWords) : null;
      list.append(controls);
      if (helpStrip) list.appendChild(helpStrip);
      list.append(box, bank);
    }

    document.getElementById("backHome").onclick = () => {
      document.getElementById("courseView").classList.remove("active");
      document.getElementById("homeView").classList.add("active");
      document.getElementById("pageSub").textContent = "每周课程复习";
      renderGarage();
    };
    function setActiveHomePanel(panelId) {
      document.querySelectorAll("#homeView .home-tab").forEach(tab => {
        tab.classList.toggle("active", tab.dataset.home === panelId);
      });
      document.querySelectorAll("#homeView .home-panel").forEach(panel => {
        panel.classList.toggle("active", panel.id === panelId);
      });
    }
    document.querySelectorAll("#homeView .home-tab").forEach(tab => {
      tab.onclick = () => setActiveHomePanel(tab.dataset.home);
    });
    function setActivePanel(panelId) {
      const courseView = document.getElementById("courseView");
      const groups = getDictationGroups();
      const hasSchool = groups.some(group => group.kind === "school" && (group.items || []).length);
      const hasHclWriting = groups.some(group => group.kind === "hcl" && (group.items || []).length);
      const hasHclPractice = !!((currentCourse?.mcq || []).length || (currentCourse?.match || []).length || (currentCourse?.order || []).length || (currentCourse?.clozeAnswers || []).length);
      const available = {
        schoolWritingPanel: hasSchool,
        hclWritingPanel: hasHclWriting,
        hclPracticePanel: hasHclPractice
      };
      let selectedPanel = available[panelId] ? panelId : "";
      if (!selectedPanel) {
        selectedPanel = hasHclPractice ? "hclPracticePanel" : hasHclWriting ? "hclWritingPanel" : hasSchool ? "schoolWritingPanel" : "hclWritingPanel";
      }
      courseView.querySelectorAll("#courseTabs .tab").forEach(t => {
        const isAvailable = !!available[t.dataset.panel];
        t.hidden = !isAvailable;
        t.classList.toggle("active", t.dataset.panel === selectedPanel);
      });
      courseView.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      document.getElementById(selectedPanel).classList.add("active");
    }
    function setActivePractice(sectionId) {
      const panel = document.getElementById("hclPracticePanel");
      panel.querySelectorAll(".subtab").forEach(t => {
        t.classList.toggle("active", t.dataset.section === sectionId);
      });
      panel.querySelectorAll(".practice-section").forEach(section => {
        section.classList.toggle("active", section.id === sectionId);
      });
    }
    document.querySelectorAll("#courseView .tab").forEach(tab => {
      tab.onclick = () => {
        setActivePanel(tab.dataset.panel);
      };
    });
    document.querySelectorAll("#hclPracticePanel .subtab").forEach(tab => {
      tab.onclick = () => {
        setActivePractice(tab.dataset.section);
      };
    });
    document.addEventListener("click", event => {
      const vocabButton = event.target.closest(".vocab-help");
      if (vocabButton) {
        event.preventDefault();
        event.stopPropagation();
        showVocabHelp(vocabButton.dataset.word);
      }
    });
    document.getElementById("voiceSelect").onchange = e => {
      selectedVoiceName = e.target.value;
      speak("这是智澹的中文朗读声音。");
    };
    document.getElementById("rateSlider").oninput = e => {
      speechRate = Number(e.target.value);
      document.getElementById("rateText").textContent = speechRate <= 0.45 ? "很慢" : speechRate <= 0.6 ? "慢" : "正常";
    };
    const parentDialog = document.getElementById("parentDialog");
    document.getElementById("openParent").onclick = () => parentDialog.showModal();
    document.getElementById("closeParent").onclick = () => parentDialog.close();
    document.getElementById("testVoice").onclick = () => speak("智澹，准备好了吗？赛车马上出发！");
    document.getElementById("lessonPhotos").onchange = e => {
      const files = [...e.target.files];
      const preview = document.getElementById("photoPreview");
      preview.innerHTML = "";
      files.forEach(file => {
        const img = document.createElement("img");
        img.alt = file.name;
        img.src = URL.createObjectURL(file);
        preview.appendChild(img);
      });
      document.getElementById("uploadStatus").textContent = files.length
        ? `已选择 ${files.length} 张照片`
        : "尚未选择照片";
      document.getElementById("prepareLesson").disabled = !files.length;
    };
    document.getElementById("prepareLesson").onclick = () => {
      document.getElementById("uploadStatus").textContent =
        "照片已准备好。请在 Codex 对话中发送这些照片，我会生成并加入下一节课。";
    };
    document.getElementById("speechToggle").onclick = toggleSpeaking;
    document.getElementById("speechStop").onclick = stopSpeaking;
    const backToTop = document.getElementById("backToTop");
    backToTop.onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });
    function refreshBackToTop() {
      backToTop.hidden = window.scrollY < 320;
    }
    window.addEventListener("scroll", refreshBackToTop, { passive: true });
    refreshBackToTop();
    renderVoices();
    renderHome();
  </script>
</body>
</html>
